<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="50%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#EC4899"/>
    </linearGradient>
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4"/>
      <stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="url(#gradient1)" stroke="none"/>
  
  <!-- Code brackets and cube design -->
  <!-- Left bracket -->
  <path d="M8 10 L6 12 L6 20 L8 22" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Right bracket -->
  <path d="M24 10 L26 12 L26 20 L24 22" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Central cube/M shape -->
  <g transform="translate(16, 16)">
    <!-- Main cube structure representing 'M' for Mithan -->
    <path d="M-4 -3 L0 -6 L4 -3 L4 3 L0 6 L-4 3 Z" fill="url(#gradient2)" stroke="white" stroke-width="1"/>
    <!-- Inner lines for 3D effect -->
    <path d="M0 -6 L0 0 M-4 -3 L0 0 M4 -3 L0 0" stroke="white" stroke-width="0.8" opacity="0.8"/>
  </g>
  
  <!-- Decorative dots -->
  <circle cx="12" cy="8" r="1" fill="white" opacity="0.6"/>
  <circle cx="20" cy="8" r="1" fill="white" opacity="0.6"/>
  <circle cx="12" cy="24" r="1" fill="white" opacity="0.6"/>
  <circle cx="20" cy="24" r="1" fill="white" opacity="0.6"/>
</svg>